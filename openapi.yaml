openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:9090
  description: Generated server url
tags:
- name: Catalog
  description: "Endpoints de lectura para navegar el inventario como un supermercado\
    \ (búsqueda, filtros, métricas)."
- name: Events (in)
  description: Simulación de consumo de eventos de otros microservicios (entrada).
- name: Categories
  description: Listado de categorías para segmentar productos.
- name: Inventory
  description: "API REST del microservicio de inventario (producto, stock y acciones\
    \ administrativas)."
- name: Recipes
  description: API para definir recetas (BOM) por plato. La receta consume insumos (productos).
- name: Consumption
  description: Consultas de consumo historico (solo lectura).
paths:
  /api/products/{sku}/reactivate:
    post:
      tags:
      - Inventory
      summary: Reactivar producto
      description: Marca el producto como ACTIVE.
      operationId: reactivate
      parameters:
      - name: sku
        in: path
        description: SKU del producto
        required: true
        schema:
          type: string
          example: SKU-1
      - name: correlationId
        in: query
        description: Correlation ID para trazabilidad
        required: false
        schema:
          type: string
          example: corr-123
      - name: reason
        in: query
        description: Motivo de reactivación
        required: false
        schema:
          type: string
          example: Vuelve a estar disponible
      responses:
        "204":
          description: Producto reactivado
        "404":
          description: Producto no encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/products/{sku}/block:
    post:
      tags:
      - Inventory
      summary: Bloquear producto
      description: "Marca el producto como BLOCKED. Mientras esté bloqueado, no se\
        \ permiten descuentos de stock."
      operationId: block
      parameters:
      - name: sku
        in: path
        description: SKU del producto
        required: true
        schema:
          type: string
          example: SKU-1
      - name: correlationId
        in: query
        description: Correlation ID para trazabilidad
        required: false
        schema:
          type: string
          example: corr-123
      - name: reason
        in: query
        description: Motivo del bloqueo
        required: false
        schema:
          type: string
          example: Producto retirado
      responses:
        "204":
          description: Producto bloqueado
        "404":
          description: Producto no encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/events/in/pedido-proveedor-recibido:
    post:
      tags:
      - Events (in)
      summary: "Consumir evento: PedidoProveedorRecibido"
      description: "Simula el consumo del evento PedidoProveedorRecibido. Repone stock\
        \ de forma transaccional, con locking pesimista e idempotencia por eventId."
      operationId: pedidoProveedorRecibido
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PedidoProveedorRecibidoEvent"
        required: true
      responses:
        "202":
          description: Evento aceptado/procesado (o duplicado por idempotencia; ver descripción)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Request inválido
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/events/in/item-agregado:
    post:
      tags:
      - Events (in)
      summary: "Consumir evento: ItemAgregado"
      description: "Simula el consumo del evento ItemAgregado. Descuenta stock de\
        \ forma transaccional, con locking pesimista e idempotencia por eventId."
      operationId: itemAgregado
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemAgregadoEvent"
        required: true
      responses:
        "202":
          description: Evento aceptado/procesado (o duplicado por idempotencia; ver descripción)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Conflicto (stock insuficiente o producto bloqueado)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Request inválido
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/events/in/comanda-cerrada:
    post:
      tags:
      - Events (in)
      summary: "Consumir evento: ComandaCerrada"
      description: "Simula el consumo del evento ComandaCerrada. Resuelve recetas activas por plato, descuenta stock por ingrediente y registra consumo histórico. Idempotente por comandaId."
      operationId: comandaCerrada
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComandaCerradaEvent"
        required: true
      responses:
        "202":
          description: Evento aceptado/procesado (o duplicado por idempotencia; ver descripción)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Conflicto (stock insuficiente o producto bloqueado)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Request inválido
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/stock:
    get:
      tags:
      - Inventory
      summary: Consultar stock
      description: "Devuelve el stock por SKU y warehouseId. Si el producto existe\
        \ pero no hay registro de stock, devuelve 0."
      operationId: getStock
      parameters:
      - name: sku
        in: query
        description: SKU del producto
        required: true
        schema:
          type: string
          example: SKU-1
      - name: warehouseId
        in: query
        description: Identificador del almacén
        required: false
        schema:
          type: string
          default: MAIN
          example: MAIN
      responses:
        "200":
          description: Stock devuelto
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StockView"
        "404":
          description: Producto no encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/products:
    get:
      tags:
      - Catalog
      summary: Listar productos (catálogo)
      description: "Listado paginado para UI tipo supermercado. Permite filtrar por\
        \ texto (sku/nombre), categoría, estado y (opcionalmente) stock por warehouse."
      operationId: listProducts
      parameters:
      - name: query
        in: query
        description: Texto a buscar en sku o nombre
        required: false
        schema:
          type: string
      - name: categoryCode
        in: query
        description: Filtrar por código de categoría
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: Filtrar por estado (ACTIVE/BLOCKED)
        required: false
        schema:
          type: string
      - name: warehouseId
        in: query
        description: Almacén para calcular stock
        required: false
        schema:
          type: string
          default: MAIN
      - name: inStockOnly
        in: query
        description: Solo productos con stock > 0
        required: false
        schema:
          type: boolean
          default: false
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: Página de productos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageProductListItem"
  /api/products/{sku}:
    get:
      tags:
      - Inventory
      summary: Consultar producto
      description: Devuelve el estado actual del producto.
      operationId: getProduct
      parameters:
      - name: sku
        in: path
        description: SKU del producto
        required: true
        schema:
          type: string
          example: SKU-1
      responses:
        "200":
          description: Producto encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductView"
        "404":
          description: Producto no encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/categories:
    get:
      tags:
      - Categories
      summary: Listar categorías
      operationId: listCategories
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryView"
  /api/categories/{code}/products:
    get:
      tags:
      - Categories
      summary: Listar productos de una categoría
      operationId: listProductsByCategory
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          example: BEBIDAS
      - name: warehouseId
        in: query
        required: false
        schema:
          type: string
          default: MAIN
          example: MAIN
      - name: inStockOnly
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: Página de productos de la categoría
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageProductInCategoryView"
        "404":
          description: Categoría no encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/recipes:
    post:
      tags:
      - Recipes
      summary: Crear receta (DRAFT)
      operationId: createRecipe
      parameters:
      - name: correlationId
        in: query
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecipeRequest"
      responses:
        "201":
          description: Receta creada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RecipeView"
  /api/recipes/{recipeId}/ingredients:
    post:
      tags:
      - Recipes
      summary: Agregar ingrediente a receta DRAFT
      operationId: addRecipeIngredient
      parameters:
      - name: recipeId
        in: path
        required: true
        schema:
          type: string
      - name: correlationId
        in: query
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddIngredientRequest"
      responses:
        "200":
          description: Ingrediente agregado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RecipeView"
  /api/recipes/{recipeId}/activate:
    post:
      tags:
      - Recipes
      summary: Activar receta
      operationId: activateRecipe
      parameters:
      - name: recipeId
        in: path
        required: true
        schema:
          type: string
      - name: correlationId
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RecipeView"
  /api/recipes/{recipeId}/version:
    post:
      tags:
      - Recipes
      summary: Versionar receta activa -> crea nueva DRAFT
      operationId: versionRecipe
      parameters:
      - name: recipeId
        in: path
        required: true
        schema:
          type: string
      - name: correlationId
        in: query
        required: false
        schema:
          type: string
      responses:
        "201":
          description: Nueva receta DRAFT creada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RecipeView"
  /api/consumption/average:
    get:
      tags:
      - Consumption
      summary: Consumo promedio por producto
      description: Calcula consumo promedio diario en una ventana configurable basada en historical_consumption.
      operationId: averageConsumption
      parameters:
      - name: sku
        in: query
        required: true
        schema:
          type: string
          example: SKU-1
      - name: windowDays
        in: query
        required: false
        schema:
          type: integer
          format: int32
          example: 30
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AverageConsumptionView"
components:
  schemas:
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    PedidoProveedorRecibidoEvent:
      type: object
      description: "Evento de entrada: llegó mercadería del proveedor y debe reponerse\
        \ stock."
      properties:
        eventId:
          type: string
          description: ID único del evento (para idempotencia)
          example: evt-124
        correlationId:
          type: string
          description: Correlation ID para trazabilidad
          example: corr-1
        sku:
          type: string
          description: SKU del producto
          example: SKU-1
        quantity:
          type: integer
          format: int64
          description: Cantidad a reponer
          example: 5
          minimum: 1
        warehouseId:
          type: string
          description: "Warehouse/almacén (si no viene, se usa el default)"
          example: MAIN
    ItemAgregadoEvent:
      type: object
      description: "Evento de entrada: se agregó un ítem a una orden/pedido y debe\
        \ descontarse stock."
      properties:
        eventId:
          type: string
          description: ID único del evento (para idempotencia)
          example: evt-123
        correlationId:
          type: string
          description: Correlation ID para trazabilidad
          example: corr-1
        sku:
          type: string
          description: SKU del producto
          example: SKU-1
        quantity:
          type: integer
          format: int64
          description: Cantidad a descontar
          example: 2
          minimum: 1
        warehouseId:
          type: string
          description: "Warehouse/almacén (si no viene, se usa el default)"
          example: MAIN
    ComandaCerradaEvent:
      type: object
      description:
        Evento de entrada: se cerró una comanda y debe descontarse stock por recetas.
      properties:
        eventId:
          type: string
          description: ID único del evento (para trazabilidad; en este endpoint la idempotencia es por comandaId).
          example: evt-200
        correlationId:
          type: string
          description: Correlation ID para trazabilidad
          example: corr-200
        comandaId:
          type: string
          description: ID único de la comanda (idempotencia)
          example: CMD-1000
        dishes:
          type: array
          items:
            $ref: "#/components/schemas/ComandaDishLine"
        warehouseId:
          type: string
          description: Warehouse/almacén (si no viene, se usa el default)
          example: MAIN
    ComandaDishLine:
      type: object
      properties:
        dishSku:
          type: string
          example: DISH-1
        quantity:
          type: integer
          format: int64
          minimum: 1
          example: 2
    StockView:
      type: object
      properties:
        sku:
          type: string
          description: SKU del producto
          example: SKU-1
        warehouseId:
          type: string
          description: Identificador del almacén
          example: MAIN
        quantity:
          type: integer
          format: int64
          description: Cantidad disponible
          example: 10
    CategoryView:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        parentCode:
          type: string
          nullable: true
    ProductListItem:
      type: object
      properties:
        sku:
          type: string
        name:
          type: string
        brand:
          type: string
        status:
          type: string
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryView"
        warehouseId:
          type: string
        stockQuantity:
          type: integer
          format: int64
        lastRequestedAt:
          type: string
          format: date-time
        estimatedExpiryAt:
          type: string
          format: date-time
        unitType:
          type: string
        unitCode:
          type: string
        unitAmount:
          type: string
    PageProductListItem:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ProductListItem"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        number:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
    ProductInCategoryView:
      type: object
      properties:
        sku:
          type: string
        name:
          type: string
        brand:
          type: string
        status:
          type: string
        warehouseId:
          type: string
        stockQuantity:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PageProductInCategoryView:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ProductInCategoryView"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        number:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
    CreateRecipeRequest:
      type: object
      required:
      - dishSku
      properties:
        dishSku:
          type: string
          example: DISH-1
    AddIngredientRequest:
      type: object
      required:
      - ingredientSku
      properties:
        ingredientSku:
          type: string
          example: SKU-ING-1
        quantity:
          type: integer
          format: int64
          example: 2
        unitCode:
          type: string
          description: Código de unidad (enum UnitCode)
          example: UNIT
    RecipeIngredientView:
      type: object
      properties:
        ingredientSku:
          type: string
        quantity:
          type: integer
          format: int64
        unitCode:
          type: string
          nullable: true
    RecipeView:
      type: object
      properties:
        recipeId:
          type: string
        dishSku:
          type: string
        version:
          type: integer
          format: int32
        status:
          type: string
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/RecipeIngredientView"
    AverageConsumptionView:
      type: object
      properties:
        sku:
          type: string
        windowDays:
          type: integer
          format: int32
        totalConsumed:
          type: integer
          format: int64
        averagePerDay:
          type: number
          format: double
    ProductView:
      type: object
      properties:
        sku:
          type: string
          description: SKU del producto
          example: SKU-1
        status:
          type: string
          description: Estado del producto
          example: ACTIVE
